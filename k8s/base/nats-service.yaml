apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: scribblydo
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: scribblydo-application
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: 8222
      protocol: TCP
  selector:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
