apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: scribblydo-aws

resources:
  - ../../base
  - pdb.yaml

namespace: scribblydo

# AWS environment labels
labels:
  - pairs:
      environment: aws
      cloud-provider: aws
    includeSelectors: false

images:
  - name: FRONTEND_IMAGE
    newName: vcluster-repository/vc-scribblydo/test/frontend
    newTag: latest
  - name: BACKEND_IMAGE
    newName: vcluster-repository/vc-scribblydo/test/backend
    newTag: latest

patches:
  # Remove Ingress - not needed in vCluster (portal DNS entries handle routing)
  - target:
      kind: Ingress
      name: scribblydo-ingress
    patch: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: scribblydo-ingress
      $patch: delete

  # Patch ConfigMap for AWS environment
  - target:
      kind: ConfigMap
      name: scribblydo-config
    patch: |
      - op: replace
        path: /data/ENVIRONMENT
        value: development
      - op: replace
        path: /data/LOG_LEVEL
        value: INFO

  # Single replica for vCluster dev environments
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # Production resource allocation
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi

  - target:
      kind: Deployment
      name: backend
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi

  - target:
      kind: Deployment
      name: postgres
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi

  # Larger PVC for production with GP3 storage class
  - target:
      kind: PersistentVolumeClaim
      name: postgres-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi
      - op: add
        path: /spec/storageClassName
        value: gp3

  # Add topology spread constraints for high availability
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: frontend
                app.kubernetes.io/component: web

  - target:
      kind: Deployment
      name: backend
    patch: |
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: backend
                app.kubernetes.io/component: api
