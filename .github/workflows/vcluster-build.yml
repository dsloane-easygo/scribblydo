name: vCluster Build

# Trigger on push to vc-* branches (e.g., vc-scribblydo/my-feature)
on:
  push:
    branches:
      - 'vc-*'
      - 'vc-*/**'

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 379820352565.dkr.ecr.eu-west-1.amazonaws.com

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      vcluster_name: ${{ steps.vars.outputs.vcluster_name }}
      branch: ${{ steps.vars.outputs.branch }}
      backend_repo: ${{ steps.vars.outputs.backend_repo }}
      frontend_repo: ${{ steps.vars.outputs.frontend_repo }}
    steps:
      - name: Extract build variables
        id: vars
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"

          # Extract vcluster name: everything after "vc-" but before first "/"
          VCLUSTER_NAME=$(echo "$BRANCH" | sed -E 's|^vc-([^/]+).*|\1|')

          if [ -z "$VCLUSTER_NAME" ]; then
            echo "Error: Could not extract vCluster name from branch $BRANCH"
            exit 1
          fi

          # ECR repository paths (each is a separate ECR repository)
          # Use branch name directly as path - ECR supports slashes natively
          # Format: vcluster-builds/{branch}/{image}
          BACKEND_REPO="vcluster-builds/${BRANCH}/backend"
          FRONTEND_REPO="vcluster-builds/${BRANCH}/frontend"

          echo "vcluster_name=$VCLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "backend_repo=$BACKEND_REPO" >> $GITHUB_OUTPUT
          echo "frontend_repo=$FRONTEND_REPO" >> $GITHUB_OUTPUT

          echo "vCluster: $VCLUSTER_NAME"
          echo "Branch: $BRANCH"
          echo "Backend repo: $BACKEND_REPO"
          echo "Frontend repo: $FRONTEND_REPO"

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::379820352565:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ needs.prepare.outputs.backend_repo }}" \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name "${{ needs.prepare.outputs.backend_repo }}" \
            --region ${{ env.AWS_REGION }} \
            --image-tag-mutability MUTABLE \
            --image-scanning-configuration scanOnPush=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ needs.prepare.outputs.backend_repo }}:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=backend-${{ needs.prepare.outputs.vcluster_name }}
          cache-to: type=gha,scope=backend-${{ needs.prepare.outputs.vcluster_name }},mode=max
          provenance: false

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::379820352565:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ needs.prepare.outputs.frontend_repo }}" \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name "${{ needs.prepare.outputs.frontend_repo }}" \
            --region ${{ env.AWS_REGION }} \
            --image-tag-mutability MUTABLE \
            --image-scanning-configuration scanOnPush=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ needs.prepare.outputs.frontend_repo }}:latest
          build-args: |
            VITE_API_URL=/api
            VITE_APP_NAME=ScribblyDo
          platforms: linux/amd64
          cache-from: type=gha,scope=frontend-${{ needs.prepare.outputs.vcluster_name }}
          cache-to: type=gha,scope=frontend-${{ needs.prepare.outputs.vcluster_name }},mode=max
          provenance: false

  trigger-sync:
    name: Trigger ArgoCD Sync
    runs-on: ubuntu-latest
    needs: [prepare, build-backend, build-frontend]
    if: needs.build-backend.result == 'success' && needs.build-frontend.result == 'success'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::379820352565:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger ArgoCD sync in vCluster
        run: |
          echo "Triggering ArgoCD sync for vCluster: ${{ needs.prepare.outputs.vcluster_name }}"
          aws lambda invoke \
            --function-name vcluster-platform-argocd-sync \
            --region ${{ env.AWS_REGION }} \
            --payload '{"vcluster_name": "${{ needs.prepare.outputs.vcluster_name }}"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/sync-response.json
          echo "Lambda response:"
          cat /tmp/sync-response.json

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [prepare, build-backend, build-frontend, trigger-sync]
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "## vCluster Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**vCluster:** ${{ needs.prepare.outputs.vcluster_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ needs.prepare.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | Tag | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ needs.prepare.outputs.backend_repo }}\` | latest | ${{ needs.build-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ needs.prepare.outputs.frontend_repo }}\` | latest | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage in vCluster manifests" >> $GITHUB_STEP_SUMMARY
          echo "Use these image references in your Kubernetes manifests inside the vCluster:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "image: vcluster-repository/${{ needs.prepare.outputs.branch }}/backend:latest" >> $GITHUB_STEP_SUMMARY
          echo "image: vcluster-repository/${{ needs.prepare.outputs.branch }}/frontend:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "Kyverno will rewrite these to the full ECR paths automatically." >> $GITHUB_STEP_SUMMARY
