name: vCluster Build

# Trigger on push to vc-* branches (e.g., vc-scribblydo/my-feature)
on:
  push:
    branches:
      - 'vc-*'
      - 'vc-*/**'

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 379820352565.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: vcluster-builds

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract vCluster name and path from branch
        id: vcluster
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Branch: $BRANCH"

          # Extract vcluster name: everything after "vc-" but before first "/"
          # e.g., "vc-scribblydo/my-feature" -> "scribblydo"
          VCLUSTER_NAME=$(echo "$BRANCH" | sed -E 's|^vc-([^/]+).*|\1|')

          if [ -z "$VCLUSTER_NAME" ]; then
            echo "Error: Could not extract vCluster name from branch $BRANCH"
            exit 1
          fi

          echo "vcluster_name=$VCLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "Extracted vCluster name: $VCLUSTER_NAME"

          # Use full branch name as path (replacing any remaining / with -)
          # e.g., "vc-scribblydo/my-feature" -> "vc-scribblydo/my-feature"
          BRANCH_PATH="$BRANCH"
          echo "branch_path=$BRANCH_PATH" >> $GITHUB_OUTPUT
          echo "Branch path: $BRANCH_PATH"

          # Use full commit SHA for tag
          echo "commit_sha=$GITHUB_SHA" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::379820352565:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repositories if needed
        run: |
          BACKEND_REPO="${{ env.ECR_REPOSITORY }}/${{ steps.vcluster.outputs.vcluster_name }}/${{ steps.vcluster.outputs.branch_path }}/scribblydo-backend"
          FRONTEND_REPO="${{ env.ECR_REPOSITORY }}/${{ steps.vcluster.outputs.vcluster_name }}/${{ steps.vcluster.outputs.branch_path }}/scribblydo-frontend"

          for REPO in "$BACKEND_REPO" "$FRONTEND_REPO"; do
            aws ecr describe-repositories --repository-names "$REPO" 2>/dev/null || \
              aws ecr create-repository --repository-name "$REPO" --image-scanning-configuration scanOnPush=true --image-tag-mutability MUTABLE
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}/${{ steps.vcluster.outputs.vcluster_name }}/${{ steps.vcluster.outputs.branch_path }}/scribblydo-backend:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=backend-${{ steps.vcluster.outputs.vcluster_name }}
          cache-to: type=gha,scope=backend-${{ steps.vcluster.outputs.vcluster_name }},mode=max
          provenance: false

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}/${{ steps.vcluster.outputs.vcluster_name }}/${{ steps.vcluster.outputs.branch_path }}/scribblydo-frontend:latest
          build-args: |
            VITE_API_URL=/api
            VITE_APP_NAME=ScribblyDo
          platforms: linux/amd64
          cache-from: type=gha,scope=frontend-${{ steps.vcluster.outputs.vcluster_name }}
          cache-to: type=gha,scope=frontend-${{ steps.vcluster.outputs.vcluster_name }},mode=max
          provenance: false

      - name: Summary
        run: |
          echo "## vCluster Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**vCluster:** ${{ steps.vcluster.outputs.vcluster_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ steps.vcluster.outputs.branch_path }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.vcluster.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images pushed:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}/${{ steps.vcluster.outputs.vcluster_name }}/${{ steps.vcluster.outputs.branch_path }}/scribblydo-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}/${{ steps.vcluster.outputs.vcluster_name }}/${{ steps.vcluster.outputs.branch_path }}/scribblydo-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
