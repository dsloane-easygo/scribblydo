name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  trigger-release:
    name: Trigger Release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger release workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                version: `0.0.${context.runNumber}`,
                prerelease: 'false'
              }
            });

  update-coverage-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_whiteboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install genbadge[coverage]

      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/todo_whiteboard_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: todo_whiteboard_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          SECRET_KEY: test-secret-key-for-ci-at-least-32-chars
          NATS_URL: nats://localhost:4222
        run: pytest --cov=app --cov-report=xml:coverage.xml --cov-fail-under=70

      - name: Generate coverage badge
        run: genbadge coverage -i coverage.xml -o ../coverage-badge.svg

      - name: Commit coverage badge
        run: |
          cd ..
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage-badge.svg
          git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"
          git push
